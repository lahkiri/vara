name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core logic tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test vara-core
        run: cargo test -p vara-core
        # This is the release gate: the provenance gate, the action policy, the
        # ActLoop harness and the protocol-parity lock all run here. A red run
        # means a promise in AGENTS.md no longer holds — do not merge past it.

  provenance-gate:
    name: Provenance gate regression (v1 data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The gate is the product's differentiator, so it gets its own job: the
      # frozen v1 numbers (backed_ratio 0.308 / FAIL) and the C3 quote-grounding
      # suite must never silently drift.
      - name: Gate tests
        run: |
          cargo test -p vara-core --test provenance_tests
          cargo test -p vara-core --test provenance_gate_tests
          cargo test -p vara-core --test protocol_parity

  web-build:
    name: Frontend build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: svelte-check
        run: npm run check
      - name: protocol parity tests (vitest, shared fixture)
        run: npm run test
      - name: vite build
        run: npm run build

  app-check:
    name: Tauri shell compiles (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build frontend (needed by tauri context)
        run: |
          npm ci
          npm run build
      - name: cargo check (whole workspace)
        run: cargo check --workspace
