name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core logic tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test vara-core
        run: cargo test -p vara-core
        # This is the release gate: the provenance gate, the action policy, the
        # ActLoop harness and the protocol-parity lock all run here. A red run
        # means a promise in AGENTS.md no longer holds — do not merge past it.
      - name: Clippy (warnings are errors)
        run: |
          cargo clippy -p vara-core -p vara-tui -p vara-plugins --all-targets -- -D warnings
        # The three crates that build without GTK. `--workspace` would drag in
        # the Tauri shell, whose `glib-sys` needs `glib-2.0.pc` — absent on a
        # stock ubuntu runner, so the step died in a build script before linting
        # a single line of this repository's code. The shell is linted and
        # compiled where it can be: the `app-check` job on windows-latest, which
        # links the real Windows APIs. Installing a full desktop stack on the
        # Linux runner to lint a core that never touches GTK would be worse than
        # splitting the check, not better.
      - name: Whole-workspace tests (not just the core crate)
        run: cargo test --workspace -p vara-core -p vara-tui -p vara-plugins
        # Same reason as clippy: the core crates on Linux, the shell on Windows.
      - name: Documentation is consistent with the repository
        run: node scripts/check-consistency.mjs
        # This job exists because the repository shipped a release whose notes
        # described files that were never committed. The script derives the
        # plugin inventory from plugins/ and fails when any document disagrees.

  provenance-gate:
    name: Provenance gate regression (v1 data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The gate is the product's differentiator, so it gets its own job: the
      # frozen v1 numbers (backed_ratio 0.308 / FAIL) and the C3 quote-grounding
      # suite must never silently drift.
      - name: Gate tests
        run: |
          cargo test -p vara-core --test provenance_tests
          cargo test -p vara-core --test provenance_gate_tests
          cargo test -p vara-core --test protocol_parity

  web-build:
    name: Frontend build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: svelte-check
        run: npm run check
      - name: protocol parity tests (vitest, shared fixture)
        run: npm run test
      - name: vite build
        run: npm run build

  app-check:
    name: Tauri shell compiles (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build frontend (needed by tauri context)
        run: |
          npm ci
          npm run build
      - name: cargo check (whole workspace)
        run: cargo check --workspace
