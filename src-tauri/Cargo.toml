[package]
name = "vara"
version = "0.3.0"
edition = "2021"
description = "Vara — a persistent autonomous entity on your desktop"
license = "MIT"
authors = ["Vara contributors"]

[lib]
name = "vara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
vara-core = { path = "../crates/vara-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "process", "rt", "macros"] }
open = "5"
notify = "7"
